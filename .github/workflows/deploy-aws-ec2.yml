name: Build and deploy to AWS EC2

on:
  push:
    branches:
      - aws-main
  workflow_dispatch:

env:
  APP_DIR: /home/${{ secrets.EC2_USER }}/uniflow-notification-service

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint
        continue-on-error: true

      - name: Run tests
        run: pnpm run test

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    environment: Production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/uniflow-notification-service

            git fetch origin aws-main
            git reset --hard origin/aws-main

            pnpm install --frozen-lockfile --prod=false
            pnpm run build

            pm2 restart uniflow-notification-service --update-env \
              || pm2 start dist/main.js --name uniflow-notification-service
